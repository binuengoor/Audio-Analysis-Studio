x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net

  gateway:
    build: ./backend
    image: audio-analysis-gateway:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-gateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      # Bound to localhost by default; the UI reaches the gateway through nginx on port 3000.
      # Set GATEWAY_BIND=0.0.0.0 (together with API_KEY) to expose the REST API on your network.
      - "${GATEWAY_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY:-}
      - API_KEYS=${API_KEYS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      backend-net:
        aliases:
          - audio-analysis-backend
          - gateway
    depends_on:
      redis:
        condition: service_healthy
      # Workers only need to be started: the gateway reports engines that are down instead of blocking
      bpm-worker:
        condition: service_started
      key-worker:
        condition: service_started
      chord-worker:
        condition: service_started
      quality-worker:
        condition: service_started
      structure-worker:
        condition: service_started
      downloader-worker:
        condition: service_started
      stretch-worker:
        condition: service_started

  celery-worker:
    build: ./backend
    image: audio-analysis-gateway:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-gateway:latest
    container_name: celery-worker
    restart: unless-stopped
    command: celery -A celery_tasks worker --loglevel=info --concurrency=4
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_tasks inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      <<: *healthcheck-timing
    networks:
      - backend-net
    depends_on:
      redis:
        condition: service_healthy
      # Workers only need to be started: the gateway reports engines that are down instead of blocking
      bpm-worker:
        condition: service_started
      key-worker:
        condition: service_started
      chord-worker:
        condition: service_started
      quality-worker:
        condition: service_started
      structure-worker:
        condition: service_started
      downloader-worker:
        condition: service_started
      stretch-worker:
        condition: service_started

  structure-worker:
    build: ./backend/workers/structure_worker
    image: audio-analysis-structure-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-structure-worker:latest
    container_name: structure-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      - backend-net

  quality-worker:
    build: ./backend/workers/quality_worker
    image: audio-analysis-quality-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-quality-worker:latest
    container_name: quality-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      - backend-net

  bpm-worker:
    build: ./backend/workers/bpm_worker
    image: audio-analysis-bpm-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-bpm-worker:latest
    container_name: bpm-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      - backend-net

  key-worker:
    build: ./backend/workers/key_worker
    image: audio-analysis-key-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-key-worker:latest
    container_name: key-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - TORCH_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      - backend-net

  chord-worker:
    build: ./backend/workers/chord_worker
    image: audio-analysis-chord-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-chord-worker:latest
    container_name: chord-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      - backend-net

  stretch-worker:
    build: ./backend/workers/stretch_worker
    image: audio-analysis-stretch-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-stretch-worker:latest
    container_name: stretch-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8007:8007"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      - backend-net

  downloader-worker:
    build: ./backend/workers/downloader_worker
    image: audio-analysis-downloader-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-downloader-worker:latest
    container_name: downloader-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8006"
    volumes:
      - ./data:/app/data/shared_audio
      - ./config:/app/cookies
    environment:
      - PYTHONUNBUFFERED=1
      - AUTO_UPDATE_YTDLP=true
      - SHARED_DATA_DIR=/app/data/shared_audio
      - COOKIES_FILE=/app/cookies/cookies.txt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=4)"]
      <<: *healthcheck-timing
    networks:
      - backend-net

  audio-analysis-frontend:
    build: ./frontend
    image: audio-analysis-frontend:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-frontend:latest
    container_name: audio-analysis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # nginx attaches this key to /api and /files requests so the browser UI works when
      # gateway authentication is enabled. Anyone who can reach port 3000 can use the UI.
      - API_KEY=${API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      <<: *healthcheck-timing
    networks:
      - backend-net
    depends_on:
      gateway:
        condition: service_started

networks:
  backend-net:
    driver: bridge
