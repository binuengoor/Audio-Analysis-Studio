services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net

  gateway:
    build: ./backend
    image: audio-analysis-gateway:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-gateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      # Auth + limits: set in .env (see .env.example). Empty API_KEY = open mode (trusted LAN only).
      - API_KEY=${API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      backend-net:
        aliases:
          - audio-analysis-backend
          - gateway
    depends_on:
      - redis
      - bpm-worker
      - key-worker
      - chord-worker
      - quality-worker
      - structure-worker
      - downloader-worker
      - stretch-worker

  celery-worker:
    build: ./backend
    image: audio-analysis-gateway:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-gateway:latest
    container_name: celery-worker
    restart: unless-stopped
    command: celery -A celery_tasks worker --loglevel=info --concurrency=4
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    networks:
      - backend-net
    depends_on:
      - redis
      - bpm-worker
      - key-worker
      - chord-worker
      - quality-worker
      - structure-worker
      - downloader-worker
      - stretch-worker

  structure-worker:
    build: ./backend/workers/structure_worker
    image: audio-analysis-structure-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-structure-worker:latest
    container_name: structure-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    networks:
      - backend-net

  quality-worker:
    build: ./backend/workers/quality_worker
    image: audio-analysis-quality-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-quality-worker:latest
    container_name: quality-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    networks:
      - backend-net

  bpm-worker:
    build: ./backend/workers/bpm_worker
    image: audio-analysis-bpm-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-bpm-worker:latest
    container_name: bpm-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    networks:
      - backend-net

  key-worker:
    build: ./backend/workers/key_worker
    image: audio-analysis-key-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-key-worker:latest
    container_name: key-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - TORCH_NUM_THREADS=4
    networks:
      - backend-net

  chord-worker:
    build: ./backend/workers/chord_worker
    image: audio-analysis-chord-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-chord-worker:latest
    container_name: chord-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    networks:
      - backend-net

  stretch-worker:
    build: ./backend/workers/stretch_worker
    image: audio-analysis-stretch-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-stretch-worker:latest
    container_name: stretch-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8007:8007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - ./data:/app/data/shared_audio
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    networks:
      - backend-net

  downloader-worker:
    build: ./backend/workers/downloader_worker
    image: audio-analysis-downloader-worker:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-downloader-worker:latest
    container_name: downloader-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - ./data:/app/data/shared_audio
      - ./config:/app/cookies
    environment:
      - PYTHONUNBUFFERED=1
      - AUTO_UPDATE_YTDLP=true
      - SHARED_DATA_DIR=/app/data/shared_audio
      - COOKIES_FILE=/app/cookies/cookies.txt
      # Set true to let the downloader fetch from LAN hosts (blocked by default to prevent SSRF)
      - ALLOW_PRIVATE_URLS=${ALLOW_PRIVATE_URLS:-false}
    networks:
      - backend-net

  audio-analysis-frontend:
    build: ./frontend
    image: audio-analysis-frontend:latest
    # To use prebuilt GitHub Container Registry image instead of local build, uncomment:
    # image: ghcr.io/binuengoor/audio-analysis-studio-frontend:latest
    container_name: audio-analysis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - backend-net
    depends_on:
      - gateway

networks:
  backend-net:
    driver: bridge
