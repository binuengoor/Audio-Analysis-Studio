name: Publish Docker images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: ./backend
          - image: frontend
            context: ./frontend
          - image: bpm-worker
            context: ./backend/workers/bpm_worker
          - image: key-worker
            context: ./backend/workers/key_worker
          - image: chord-worker
            context: ./backend/workers/chord_worker
          - image: structure-worker
            context: ./backend/workers/structure_worker
          - image: quality-worker
            context: ./backend/workers/quality_worker
          - image: downloader-worker
            context: ./backend/workers/downloader_worker
          - image: stretch-worker
            context: ./backend/workers/stretch_worker
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-${{ matrix.image }}:${{ github.sha }}
