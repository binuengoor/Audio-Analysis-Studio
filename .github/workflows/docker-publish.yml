name: Publish Docker images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, context: ./backend }
          - { name: frontend, context: ./frontend }
          - { name: bpm-worker, context: ./backend/workers/bpm_worker }
          - { name: key-worker, context: ./backend/workers/key_worker }
          - { name: chord-worker, context: ./backend/workers/chord_worker }
          - { name: structure-worker, context: ./backend/workers/structure_worker }
          - { name: quality-worker, context: ./backend/workers/quality_worker }
          - { name: downloader-worker, context: ./backend/workers/downloader_worker }
          - { name: stretch-worker, context: ./backend/workers/stretch_worker }
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-${{ matrix.name }}:${{ github.sha }}
