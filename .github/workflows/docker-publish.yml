name: Publish Docker images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-frontend:${{ github.sha }}

      - name: Build and push structure worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/workers/structure_worker
          file: ./backend/workers/structure_worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-structure-worker:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-structure-worker:${{ github.sha }}

      - name: Build and push quality worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/workers/quality_worker
          file: ./backend/workers/quality_worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-quality-worker:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/audio-analysis-studio-quality-worker:${{ github.sha }}
